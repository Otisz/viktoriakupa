x-php: &php
  build: .
  volumes:
    - .:/var/www/html
  environment:
    INERTIA_SSR_URL: http://ssr:13714
    INERTIA_SSR_HOT_URL: http://bun:5173
  depends_on:
    pgsql:
      condition: service_healthy

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:listen --tries=1

  nginx:
    image: nginx:1-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  bun:
    image: oven/bun:1
    working_dir: /var/www/html
    command: bun run dev --host
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  ssr:
    image: oven/bun:1
    working_dir: /var/www/html
    command: bun bootstrap/ssr/ssr.js
    profiles: [ssr]
    restart: unless-stopped
    volumes:
      - .:/var/www/html

  pgsql:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgsql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgsql:
