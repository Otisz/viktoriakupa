x-php: &php
  build: .
  volumes:
    - .:/var/www/html
  environment:
    INERTIA_SSR_URL: http://ssr:13714
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:listen --tries=1

  nginx:
    image: nginx:1-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  bun:
    image: oven/bun:1
    working_dir: /var/www/html
    command: bun run dev --host
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  ssr:
    image: oven/bun:1
    working_dir: /var/www/html
    command: bun bootstrap/ssr/ssr.js
    profiles: [ssr]
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql:
